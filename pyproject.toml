[project]
name = "ov-multimodal-classifier"
version = "1.0.0"
description = "Multimodal deep learning classifier for ovarian cancer using ultrasound images and clinical data"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.9.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "scikit-image>=0.21.0",
    "pydicom>=2.4.0",
    "scikit-learn>=1.3.0",
    "jieba>=0.42.0",
    "gensim>=4.3.0",
    "transformers>=4.30.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.2",
    "pymupdf>=1.26.7",
    "graphviz>=0.21",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
